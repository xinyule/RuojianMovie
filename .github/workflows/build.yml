name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Locate sdkmanager
        id: sdk
        run: |
          SM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then SM=$(command -v sdkmanager || true); fi
          echo "sdkmanager=$SM"
          echo "path=$SM" >> "$GITHUB_OUTPUT"

      - name: Accept SDK licenses
        run: |
          yes | "${{ steps.sdk.outputs.path }}" --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          "${{ steps.sdk.outputs.path }}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" 2>&1 | tail -5

      - name: Disk before build
        run: df -h /home/runner

      - name: Build release APK
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      - name: Show APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruojian-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
